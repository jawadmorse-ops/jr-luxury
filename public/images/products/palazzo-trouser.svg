<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sandwashed silk — more matte, less directional weave -->
    <pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="5" y2="5" stroke="#607868" stroke-width="0.38" opacity="0.40"/>
      <line x1="0" y1="2.5" x2="2.5" y2="5" stroke="#607868" stroke-width="0.22" opacity="0.22"/>
      <line x1="2.5" y1="0" x2="5" y2="2.5" stroke="#607868" stroke-width="0.22" opacity="0.22"/>
    </pattern>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <line x1="0" y1="0" x2="3" y2="0" stroke="#4A6852" stroke-width="0.2" opacity="0.35"/>
    </pattern>
    <!-- Muted sage gradient — sandwashing gives diffuse, non-directional light -->
    <radialGradient id="base" cx="42%" cy="32%" r="80%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#92AA96"/>
      <stop offset="36%"  stop-color="#728A78"/>
      <stop offset="68%"  stop-color="#506860"/>
      <stop offset="100%" stop-color="#2E4840"/>
    </radialGradient>
    <!-- Soft diffuse sheen — sandwashed silk has no sharp highlight -->
    <linearGradient id="sheen" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="25%"  stop-color="white" stop-opacity="0.0"/>
      <stop offset="40%"  stop-color="white" stop-opacity="0.10"/>
      <stop offset="48%"  stop-color="white" stop-opacity="0.04"/>
      <stop offset="62%"  stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="bot" x1="0%" y1="62%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0A0E0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0E0A" stop-opacity="0.58"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="68%">
      <stop offset="0%"   stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.22"/>
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="url(#base)"/>
  <rect width="600" height="800" fill="url(#weave)" opacity="0.7"/>
  <rect width="600" height="800" fill="url(#grain)" opacity="0.5"/>

  <!-- Soft fold panels — sandwashed silk drapes more softly -->
  <rect x="-45" y="100" width="235" height="700" rx="1" transform="rotate(-3.2 72 450)"  fill="black" fill-opacity="0.055"/>
  <rect x="155" y="65"  width="300" height="730" rx="1" transform="rotate( 2.0 305 430)"  fill="white" fill-opacity="0.038"/>
  <rect x="355" y="82"  width="295" height="695" rx="1" transform="rotate(-2.5 505 430)"  fill="black" fill-opacity="0.050"/>

  <!-- Soft crease lines — less sharp than polished silk -->
  <line x1="0" y1="275" x2="600" y2="282" stroke="#2E4840" stroke-width="1.5" opacity="0.14"/>
  <line x1="0" y1="455" x2="600" y2="460" stroke="#2E4840" stroke-width="1.0" opacity="0.09"/>

  <rect width="600" height="800" fill="url(#sheen)"/>
  <rect width="600" height="800" fill="url(#vignette)"/>
  <rect width="600" height="800" fill="url(#bot)"/>

  <!-- Corner marks -->
  <path d="M28 28 L76 28 M28 28 L28 76"   stroke="#C9A96E" stroke-width="0.75" opacity="0.28" stroke-linecap="square"/>
  <path d="M572 28 L524 28 M572 28 L572 76"  stroke="#C9A96E" stroke-width="0.75" opacity="0.28" stroke-linecap="square"/>
  <path d="M28 772 L76 772 M28 772 L28 724"  stroke="#C9A96E" stroke-width="0.75" opacity="0.28" stroke-linecap="square"/>
  <path d="M572 772 L524 772 M572 772 L572 724" stroke="#C9A96E" stroke-width="0.75" opacity="0.28" stroke-linecap="square"/>

  <!-- Annotation -->
  <line x1="78" y1="720" x2="522" y2="720" stroke="#C9A96E" stroke-width="0.5" opacity="0.24"/>
  <text x="300" y="742" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="9" fill="#C9A96E" opacity="0.60" letter-spacing="3.5">SANDWASHED SILK · 19MM</text>
  <text x="300" y="762" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="9.5" font-style="italic" fill="#EAF0EA" opacity="0.40" letter-spacing="2">The Palazzo</text>
  <line x1="78" y1="774" x2="522" y2="774" stroke="#C9A96E" stroke-width="0.4" opacity="0.14"/>
</svg>
