<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Charmeuse satin weave — very subtle on near-black -->
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="6" y2="0" stroke="#2A2018" stroke-width="0.5" opacity="0.7"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#1E1810" stroke-width="0.3" opacity="0.5"/>
    </pattern>
    <!-- Base gradient — deep midnight with warm candlelight from upper right -->
    <radialGradient id="base" cx="74%" cy="20%" r="78%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#2C2218"/>
      <stop offset="28%"  stop-color="#181208"/>
      <stop offset="62%"  stop-color="#0E0A06"/>
      <stop offset="100%" stop-color="#060402"/>
    </radialGradient>
    <!-- Gold candle-catch sheen — characteristic of heavy charmeuse -->
    <linearGradient id="sheen" x1="100%" y1="0%" x2="20%" y2="80%">
      <stop offset="0%"   stop-color="#C9A96E" stop-opacity="0.00"/>
      <stop offset="22%"  stop-color="#C9A96E" stop-opacity="0.07"/>
      <stop offset="30%"  stop-color="#C9A96E" stop-opacity="0.14"/>
      <stop offset="36%"  stop-color="#D4B87A" stop-opacity="0.06"/>
      <stop offset="44%"  stop-color="#C9A96E" stop-opacity="0.00"/>
    </linearGradient>
    <!-- Secondary cold sheen from left -->
    <linearGradient id="sheen2" x1="0%" y1="30%" x2="60%" y2="100%">
      <stop offset="0%"  stop-color="white" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="42%" stop-color="white" stop-opacity="0.02"/>
      <stop offset="52%" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%"   stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.38"/>
    </radialGradient>
    <!-- Annotation vignette -->
    <linearGradient id="bot" x1="0%" y1="65%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#060402" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060402" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#base)"/>
  <rect width="600" height="800" fill="url(#weave)" opacity="0.9"/>

  <!-- Deep fold shadows — barely discernible on near-black -->
  <rect x="-40" y="110" width="220" height="680" rx="0.5" transform="rotate(-3.5 70 450)" fill="black" fill-opacity="0.18"/>
  <rect x="160" y="70"  width="280" height="720" rx="0.5" transform="rotate( 2.2 300 430)" fill="white" fill-opacity="0.018"/>
  <rect x="370" y="90"  width="290" height="680" rx="0.5" transform="rotate(-2.8 515 430)" fill="black" fill-opacity="0.22"/>

  <!-- Candlelight warm sheen -->
  <rect width="600" height="800" fill="url(#sheen)"/>
  <!-- Cool secondary sheen -->
  <rect width="600" height="800" fill="url(#sheen2)"/>
  <!-- Edge vignette for depth -->
  <rect width="600" height="800" fill="url(#vignette)"/>
  <!-- Bottom vignette -->
  <rect width="600" height="800" fill="url(#bot)"/>

  <!-- Gold piping line — signature detail on left edge -->
  <line x1="48" y1="80" x2="48" y2="640" stroke="#C9A96E" stroke-width="0.65" opacity="0.22"/>
  <line x1="50" y1="80" x2="50" y2="640" stroke="#C9A96E" stroke-width="0.4"  opacity="0.10"/>

  <!-- Corner marks -->
  <path d="M28 28 L76 28 M28 28 L28 76"   stroke="#C9A96E" stroke-width="0.75" opacity="0.30" stroke-linecap="square"/>
  <path d="M572 28 L524 28 M572 28 L572 76"  stroke="#C9A96E" stroke-width="0.75" opacity="0.30" stroke-linecap="square"/>
  <path d="M28 772 L76 772 M28 772 L28 724"  stroke="#C9A96E" stroke-width="0.75" opacity="0.30" stroke-linecap="square"/>
  <path d="M572 772 L524 772 M572 772 L572 724" stroke="#C9A96E" stroke-width="0.75" opacity="0.30" stroke-linecap="square"/>

  <!-- Annotation -->
  <line x1="78" y1="720" x2="522" y2="720" stroke="#C9A96E" stroke-width="0.5" opacity="0.25"/>
  <text x="300" y="742" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="9" fill="#C9A96E" opacity="0.62" letter-spacing="3.5">CHARMEUSE SILK · 22MM</text>
  <text x="300" y="762" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="9.5" font-style="italic" fill="#E8DDD0" opacity="0.38" letter-spacing="2">The Noir</text>
  <line x1="78" y1="774" x2="522" y2="774" stroke="#C9A96E" stroke-width="0.4" opacity="0.14"/>
</svg>
