<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fine lace geometric overlay — Valenciennes-inspired diamond grid -->
    <pattern id="lace" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="none"/>
      <rect x="5" y="5" width="12" height="12" stroke="#D0C8BE" stroke-width="0.35" fill="none" opacity="0.55"/>
      <circle cx="11" cy="11" r="1.8" stroke="#C8C0B6" stroke-width="0.3" fill="none" opacity="0.4"/>
      <line x1="11" y1="5" x2="11" y2="0"  stroke="#D0C8BE" stroke-width="0.28" opacity="0.4"/>
      <line x1="11" y1="17" x2="11" y2="22" stroke="#D0C8BE" stroke-width="0.28" opacity="0.4"/>
      <line x1="5" y1="11" x2="0" y2="11"   stroke="#D0C8BE" stroke-width="0.28" opacity="0.4"/>
      <line x1="17" y1="11" x2="22" y2="11"  stroke="#D0C8BE" stroke-width="0.28" opacity="0.4"/>
    </pattern>
    <!-- Pearl silk gradient — luminous, almost glowing -->
    <radialGradient id="base" cx="40%" cy="28%" r="80%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FDFCFA"/>
      <stop offset="32%"  stop-color="#F5F0E8"/>
      <stop offset="65%"  stop-color="#E8E0D4"/>
      <stop offset="100%" stop-color="#C8C0B0"/>
    </radialGradient>
    <!-- Very bright sheen — pearl and white silk have the strongest highlights -->
    <linearGradient id="sheen" x1="5%" y1="0%" x2="100%" y2="100%">
      <stop offset="22%"  stop-color="white" stop-opacity="0.0"/>
      <stop offset="36%"  stop-color="white" stop-opacity="0.30"/>
      <stop offset="42%"  stop-color="white" stop-opacity="0.14"/>
      <stop offset="54%"  stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Secondary pearl sheen -->
    <radialGradient id="pearl-glow" cx="35%" cy="25%" r="45%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="bot" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.48"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#base)"/>

  <!-- Delicate lace pattern — lower half only, as trim detail -->
  <rect x="0" y="460" width="600" height="340" fill="url(#lace)" opacity="0.7"/>
  <!-- Lace fade-in gradient -->
  <linearGradient id="lace-fade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="white" stop-opacity="1"/>
    <stop offset="100%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <rect x="0" y="460" width="600" height="80" fill="white" fill-opacity="1"/>
  <rect x="0" y="460" width="600" height="80">
    <animate attributeName="fill-opacity" values="0" dur="0"/>
  </rect>

  <!-- Lace transition line -->
  <line x1="0" y1="500" x2="600" y2="500" stroke="#C9A96E" stroke-width="0.4" opacity="0.2"/>

  <!-- Very subtle fabric fold panels on silk layer -->
  <rect x="-40" y="80"  width="230" height="680" rx="0.5" transform="rotate(-3.5 75 420)"  fill="black" fill-opacity="0.028"/>
  <rect x="150" y="55"  width="295" height="720" rx="0.5" transform="rotate( 2.2 300 415)"  fill="white" fill-opacity="0.022"/>
  <rect x="360" y="75"  width="285" height="680" rx="0.5" transform="rotate(-2.8 505 415)"  fill="black" fill-opacity="0.025"/>

  <rect width="600" height="800" fill="url(#sheen)"/>
  <rect width="600" height="800" fill="url(#pearl-glow)"/>
  <rect width="600" height="800" fill="url(#bot)"/>

  <!-- Corner marks -->
  <path d="M28 28 L76 28 M28 28 L28 76"   stroke="#C9A96E" stroke-width="0.75" opacity="0.30" stroke-linecap="square"/>
  <path d="M572 28 L524 28 M572 28 L572 76"  stroke="#C9A96E" stroke-width="0.75" opacity="0.30" stroke-linecap="square"/>
  <path d="M28 772 L76 772 M28 772 L28 724"  stroke="#C9A96E" stroke-width="0.75" opacity="0.30" stroke-linecap="square"/>
  <path d="M572 772 L524 772 M572 772 L572 724" stroke="#C9A96E" stroke-width="0.75" opacity="0.30" stroke-linecap="square"/>

  <!-- Annotation -->
  <line x1="78" y1="720" x2="522" y2="720" stroke="#C9A96E" stroke-width="0.5" opacity="0.26"/>
  <text x="300" y="742" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="9" fill="#C9A96E" opacity="0.65" letter-spacing="3.5">SILK LACE · HANDMADE TRIM</text>
  <text x="300" y="762" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="9.5" font-style="italic" fill="#1A1A1A" opacity="0.38" letter-spacing="2">Côte d'Azur</text>
  <line x1="78" y1="774" x2="522" y2="774" stroke="#C9A96E" stroke-width="0.4" opacity="0.15"/>
</svg>
