<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Silk twill weave — vertical warp threads -->
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C8B898" stroke-width="0.45" opacity="0.55"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#C8B898" stroke-width="0.28" opacity="0.28"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#D4C4A8" stroke-width="0.22" opacity="0.18"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#D4C4A8" stroke-width="0.18" opacity="0.12"/>
    </pattern>
    <!-- Base fabric gradient — warm ivory -->
    <radialGradient id="base" cx="34%" cy="26%" r="84%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#F8F4EE"/>
      <stop offset="38%"  stop-color="#EDE5D6"/>
      <stop offset="72%"  stop-color="#D8C8B0"/>
      <stop offset="100%" stop-color="#BEA882"/>
    </radialGradient>
    <!-- Diagonal silk sheen — characteristic ivory iridescence -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="28%"  stop-color="white" stop-opacity="0"/>
      <stop offset="40%"  stop-color="white" stop-opacity="0.22"/>
      <stop offset="46%"  stop-color="white" stop-opacity="0.10"/>
      <stop offset="56%"  stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Bottom annotation vignette -->
    <linearGradient id="vignette" x1="0%" y1="62%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0A0806" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0806" stop-opacity="0.52"/>
    </linearGradient>
  </defs>

  <!-- Base fabric -->
  <rect width="600" height="800" fill="url(#base)"/>
  <!-- Weave texture -->
  <rect width="600" height="800" fill="url(#weave)" opacity="0.7"/>

  <!-- Fabric fold panels — overlapping planes suggesting draped silk -->
  <rect x="-55" y="90"  width="245" height="720" rx="0.5" transform="rotate(-4.2 68 450)"  fill="black" fill-opacity="0.048"/>
  <rect x="145" y="55"  width="310" height="740" rx="0.5" transform="rotate( 2.8 300 425)"  fill="white" fill-opacity="0.036"/>
  <rect x="355" y="75"  width="310" height="700" rx="0.5" transform="rotate(-3.0 510 425)"  fill="black" fill-opacity="0.042"/>

  <!-- Subtle horizontal crease lines -->
  <line x1="0" y1="268" x2="600" y2="275" stroke="#A89070" stroke-width="1.4" opacity="0.09"/>
  <line x1="0" y1="448" x2="600" y2="454" stroke="#A89070" stroke-width="0.9" opacity="0.065"/>
  <line x1="0" y1="584" x2="600" y2="589" stroke="#A89070" stroke-width="0.7" opacity="0.048"/>

  <!-- Silk sheen band -->
  <rect width="600" height="800" fill="url(#sheen)"/>
  <!-- Bottom vignette for annotation legibility -->
  <rect width="600" height="800" fill="url(#vignette)"/>

  <!-- Corner atelier marks -->
  <path d="M28 28 L76 28 M28 28 L28 76"   stroke="#C9A96E" stroke-width="0.75" opacity="0.32" stroke-linecap="square"/>
  <path d="M572 28 L524 28 M572 28 L572 76"  stroke="#C9A96E" stroke-width="0.75" opacity="0.32" stroke-linecap="square"/>
  <path d="M28 772 L76 772 M28 772 L28 724"  stroke="#C9A96E" stroke-width="0.75" opacity="0.32" stroke-linecap="square"/>
  <path d="M572 772 L524 772 M572 772 L572 724" stroke="#C9A96E" stroke-width="0.75" opacity="0.32" stroke-linecap="square"/>

  <!-- Annotation -->
  <line x1="78" y1="720" x2="522" y2="720" stroke="#C9A96E" stroke-width="0.5" opacity="0.28"/>
  <text x="300" y="742" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="9" fill="#C9A96E" opacity="0.68" letter-spacing="3.5">MULBERRY SILK · GRADE 6A</text>
  <text x="300" y="762" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="9.5" font-style="italic" fill="#F5F0E8" opacity="0.44" letter-spacing="2">The Riviera</text>
  <line x1="78" y1="774" x2="522" y2="774" stroke="#C9A96E" stroke-width="0.4" opacity="0.15"/>
</svg>
